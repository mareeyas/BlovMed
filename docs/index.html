<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BlovMed</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BlovMed">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="config.js"></script>
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F6;--card:#fff;--ink:#12202B;--mute:#5B6B78;--line:#D9E2E8;--acc:#2D5BFF;--accink:#fff;--ok:#12805A;--okbg:#DDF3EA;--bad:#C9323B;--badbg:#FCE4E5;--warn:#8A5A00;--warnbg:#FFF0CC;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F171D;--card:#18232B;--ink:#EAF1F5;--mute:#93A4B1;--line:#2A3943;--acc:#6C8BFF;--accink:#0F171D;--ok:#4CD6A0;--okbg:#14352A;--bad:#FF7A82;--badbg:#3B1A1D;--warn:#F5C451;--warnbg:#3A2E10}}
:root[data-theme="dark"]{--bg:#0F171D;--card:#18232B;--ink:#EAF1F5;--mute:#93A4B1;--line:#2A3943;--acc:#6C8BFF;--accink:#0F171D;--ok:#4CD6A0;--okbg:#14352A;--bad:#FF7A82;--badbg:#3B1A1D;--warn:#F5C451;--warnbg:#3A2E10}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",-apple-system,system-ui,"Segoe UI",sans-serif;font-size:18px;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:30px;margin:8px 0 2px;letter-spacing:-.5px}h2{font-size:21px;margin:22px 0 8px}
.sub{color:var(--mute);margin:0 0 14px}
.hero{border-radius:22px;padding:20px;margin:10px 0 16px;background:var(--acc);color:var(--accink)}
.hero.late{background:var(--bad);color:#fff}.hero.done{background:var(--ok);color:#fff}
.hero small{opacity:.85;font-size:16px}.hero b{display:block;font-size:30px;line-height:1.15;margin:4px 0 14px}
.hero button{background:#fff;color:#12202B;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:20px;padding:14px 20px;width:100%}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 16px}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.dose{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;width:100%;font:inherit;color:inherit;text-align:left}
.dose .t{min-width:76px;font-weight:700;font-size:19px}.dose .n{flex:1}.dose .n span{display:block;color:var(--mute);font-size:15px}
.dose .c{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-weight:700;color:transparent}
.dose.taken{background:var(--okbg);border-color:transparent}.dose.taken .c{background:var(--ok);border-color:var(--ok);color:#fff}.dose.taken .n{text-decoration:line-through;opacity:.7}
.dose.overdue{border-color:var(--bad);background:var(--badbg)}.dose.overdue .c{border-color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.row+.row{margin-top:6px}
.pill{display:inline-block;border-radius:99px;padding:3px 11px;font-size:15px;font-weight:700}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:14px;font:inherit;font-weight:700;padding:13px 18px}
.btn.ghost{background:transparent;color:var(--acc);border:2px solid var(--line)}.btn.red{background:var(--bad);color:#fff}.btn.full{width:100%}
.note{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:16px}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;font:inherit;font-weight:700;font-size:16px;color:var(--mute);padding:10px 4px;border-radius:12px}
nav button.on{color:var(--acc);background:var(--bg)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:9}.sheet.open{display:flex}
.sheet>div{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:16px}
input{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 8px 6px 14px;font-weight:700}
.chip button{border:0;background:none;color:var(--bad);font-size:20px;font:inherit;font-weight:700;padding:0 6px}
.add{display:flex;gap:8px}.add input{flex:1}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<script>
const $=s=>document.querySelector(s);
const K='medmate.v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{meds:[],log:{},paydays:[15,30],cur:'₱'};
let tab='today',edit=null,notified={};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}sync()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const day0=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const fmtT=t=>{const[h,m]=t.split(':').map(Number);return((h+11)%12+1)+':'+pad(m)+' '+(h<12?'AM':'PM')};
const money=n=>S.cur+Math.round(n).toLocaleString('en-US');
const fmtD=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};

/* ---------- logic ---------- */
function dosesToday(){
  const k=ymd(new Date()),out=[];
  S.meds.forEach(m=>m.times.forEach(t=>out.push({key:k+'|'+m.id+'|'+t,med:m,t,taken:!!S.log[k+'|'+m.id+'|'+t]})));
  return out.sort((a,b)=>mins(a.t)-mins(b.t));
}
function status(d){
  if(d.taken)return'taken';
  const diff=nowMin()-mins(d.t);
  return diff>=30?'overdue':diff>=0?'due':'upcoming';
}
function toggle(key){
  const[,id]=key.split('|'),m=S.meds.find(x=>x.id===id);if(!m)return;
  if(S.log[key]){delete S.log[key];m.stock+=m.perDose}
  else{S.log[key]=Date.now();m.stock=Math.max(0,m.stock-m.perDose)}
  save();render();
}
const lastDay=(y,m)=>new Date(y,m+1,0).getDate();
function nextPaydays(n,from){
  const t=from||day0(),out=[],pd=[...S.paydays].sort((a,b)=>a-b);
  for(let k=0;out.length<n+2&&k<6;k++){
    const y=new Date(t.getFullYear(),t.getMonth()+k,1);
    pd.forEach(p=>{const d=new Date(y.getFullYear(),y.getMonth(),Math.min(p,lastDay(y.getFullYear(),y.getMonth())));if(d>=t)out.push(d)});
  }
  return out.slice(0,n);
}
const dayDiff=(a,b)=>Math.round((b-a)/864e5);
function plan(from){
  const t=from||day0(),[p1,p2]=nextPaydays(2,t),toPay=dayDiff(t,p1),cycle=dayDiff(p1,p2);
  const rows=S.meds.map(m=>{
    const daily=m.perDose*m.times.length||1,pack=Math.max(1,m.packSize||1),price=m.price||0;
    const daysLeft=Math.floor(m.stock/daily);
    const nowNeed=Math.max(0,daily*toPay-m.stock),atPay=Math.max(0,m.stock-daily*toPay);
    const payNeed=Math.max(0,daily*cycle-atPay);
    const nowPacks=Math.ceil(nowNeed/pack),payPacks=Math.ceil(payNeed/pack);
    return{m,daily,daysLeft,runout:new Date(t.getFullYear(),t.getMonth(),t.getDate()+daysLeft),nowPacks,nowCost:nowPacks*price,payPacks,payCost:payPacks*price};
  });
  return{p1,p2,toPay,cycle,rows,nowTotal:rows.reduce((s,r)=>s+r.nowCost,0),payTotal:rows.reduce((s,r)=>s+r.payCost,0)};
}

/* ---------- views ---------- */
function viewToday(){
  const ds=dosesToday();
  if(!S.meds.length)return`<h1>Today</h1><div class="empty"><p>No medications yet.</p><button class="btn" data-a="new">Add your first medication</button></div>`;
  const done=ds.filter(d=>d.taken).length,pct=ds.length?done/ds.length*100:0;
  const act=ds.find(d=>!d.taken&&status(d)!=='upcoming')||null,nxt=ds.find(d=>!d.taken);
  let hero;
  if(!nxt)hero=`<div class="hero done"><small>Today</small><b>All done. Nice work.</b></div>`;
  else{
    const late=act&&status(act)==='overdue',d=act||nxt;
    hero=`<div class="hero ${late?'late':''}"><small>${act?(late?'Late. Take it now':'Time to take'):'Up next at '+fmtT(d.t)}</small><b>${esc(d.med.name)}${d.med.perDose>1?' ×'+d.med.perDose:''}</b>${act?`<button data-a="tk" data-k="${d.key}">I took it</button>`:''}</div>`;
  }
  const low=S.meds.filter(m=>m.stock/(m.perDose*m.times.length||1)<=3);
  const perm=S.sub?`<div class="note" style="background:var(--okbg);color:var(--ok)">Phone alerts are on</div>`:`<button class="btn full" data-a="perm" style="margin-bottom:6px">Turn on phone alerts</button><p class="sub">On iPhone: tap Share, then Add to Home Screen, then open the app from its icon first.</p>`;
  return`<h1>Today</h1><p class="sub">${done} of ${ds.length} doses taken</p><div class="bar"><i style="width:${pct}%"></i></div>${hero}${perm}
  ${low.map(m=>`<div class="note">${esc(m.name)} is almost out. Check the Money tab.</div>`).join('')}
  ${ds.map(d=>{const s=status(d);return`<button class="dose ${s}" data-a="tk" data-k="${d.key}"><span class="t">${fmtT(d.t)}</span><span class="n">${esc(d.med.name)}<span>${d.med.perDose} pill${d.med.perDose>1?'s':''}${d.med.dose?' · '+esc(d.med.dose):''}${s==='overdue'?' · late':''}</span></span><span class="c">✓</span></button>`}).join('')}`;
}
function viewMeds(){
  const times=[...new Set(S.meds.flatMap(m=>m.times))].sort();
  return`<h1>Medications</h1><p class="sub">Tap one to edit.</p>
  ${S.meds.map(m=>`<button class="dose" data-a="edit" data-id="${m.id}"><span class="n">${esc(m.name)}<span>${m.times.map(fmtT).join(', ')} · ${m.stock} left</span></span></button>`).join('')||'<div class="empty">Nothing here yet.</div>'}
  <button class="btn full" data-a="new">Add medication</button>
  ${times.length?`<h2>Phone alarms</h2><div class="card"><p style="margin-top:0">Phone alerts come from this app. As a backup, you can also add repeating Clock alarms at:</p><p><b>${times.map(fmtT).join(' · ')}</b></p><p class="sub" style="margin:0">Label each alarm with the medicine name.</p></div>`:''}`;
}
function viewMoney(){
  if(!S.meds.length)return`<h1>Money</h1><div class="empty">Add a medication first.</div>`;
  const p=plan();
  const rowHtml=(r,w)=>{const pk=w==='now'?r.nowPacks:r.payPacks,c=w==='now'?r.nowCost:r.payCost;return pk?`<div class="row"><span>${esc(r.m.name)} · ${pk} pack${pk>1?'s':''}</span><b>${money(c)}</b></div>`:''};
  return`<h1>Money</h1><p class="sub">Paydays: ${S.paydays.join(' and ')} of each month</p>
  ${p.nowTotal>0?`<div class="card" style="border:2px solid var(--bad)"><div class="row"><b>Buy before payday</b><span class="pill bad">${p.toPay} day${p.toPay===1?'':'s'} to go</span></div><div class="big">${money(p.nowTotal)}</div><p class="sub" style="margin:0 0 8px">You run out before ${fmtD(p.p1)}.</p>${p.rows.map(r=>rowHtml(r,'now')).join('')}</div>`:`<div class="card"><span class="pill ok">Covered until payday</span></div>`}
  <div class="card"><div class="row"><b>Set aside on ${fmtD(p.p1)}</b><span class="pill warn">${p.cycle} days</span></div><div class="big">${money(p.payTotal)}</div><p class="sub" style="margin:0 0 8px">Covers you until ${fmtD(p.p2)}.</p>${p.rows.map(r=>rowHtml(r,'pay')).join('')||'<p class="sub">Nothing to buy. You have enough stock.</p>'}</div>
  <h2>Stock</h2>${p.rows.map(r=>`<div class="card"><div class="row"><b>${esc(r.m.name)}</b><span class="pill ${r.daysLeft<=3?'bad':r.daysLeft<=7?'warn':'ok'}">${r.daysLeft} day${r.daysLeft===1?'':'s'} left</span></div><div class="row"><span class="sub">${r.m.stock} pills · uses ${r.daily}/day</span><span class="sub">out ${fmtD(r.runout)}</span></div></div>`).join('')}
  <h2>Settings</h2><div class="card"><label style="margin-top:0">Payday dates</label><div class="two"><input id="pd1" type="number" min="1" max="31" value="${S.paydays[0]}"><input id="pd2" type="number" min="1" max="31" value="${S.paydays[1]}"></div><label>Currency symbol</label><input id="cur" maxlength="3" value="${esc(S.cur)}"><button class="btn full" style="margin-top:14px" data-a="set">Save settings</button></div>`;
}
function render(){
  $('#app').innerHTML=tab==='today'?viewToday():tab==='meds'?viewMeds():viewMoney();
  $('#nav').innerHTML=[['today','Today'],['meds','Meds'],['money','Money']].map(([k,l])=>`<button data-a="tab" data-k="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');
}

/* ---------- editor ---------- */
function openEdit(id){
  const m=S.meds.find(x=>x.id===id);
  edit=m?JSON.parse(JSON.stringify(m)):{id:'m'+Date.now(),name:'',dose:'',perDose:1,times:['08:00'],stock:30,packSize:30,price:0,isNew:true};
  drawSheet();$('#sheet').classList.add('open');
}
function drawSheet(){
  const e=edit;
  $('#sheetBody').innerHTML=`<h1 style="margin-top:0">${e.isNew?'Add medication':'Edit medication'}</h1>
  <label>Name</label><input id="f_name" value="${esc(e.name)}" placeholder="e.g. Sertraline">
  <div class="two"><div><label>Strength (optional)</label><input id="f_dose" value="${esc(e.dose)}" placeholder="50 mg"></div><div><label>Pills per dose</label><input id="f_per" type="number" min="1" value="${e.perDose}"></div></div>
  <label>Times each day</label><div class="chips">${e.times.map((t,i)=>`<span class="chip">${fmtT(t)}<button data-a="rmt" data-i="${i}">×</button></span>`).join('')}</div>
  <div class="add"><input id="f_t" type="time" value="20:00"><button class="btn ghost" data-a="addt">Add time</button></div>
  <div class="two"><div><label>Pills on hand</label><input id="f_stock" type="number" min="0" value="${e.stock}"></div><div><label>Pills per pack</label><input id="f_pack" type="number" min="1" value="${e.packSize}"></div></div>
  <label>Price per pack (${esc(S.cur)})</label><input id="f_price" type="number" min="0" step="0.01" value="${e.price}">
  <button class="btn full" style="margin-top:18px" data-a="savem">Save</button>
  <button class="btn ghost full" style="margin-top:10px" data-a="close">Cancel</button>
  ${e.isNew?'':'<button class="btn red full" style="margin-top:10px" data-a="delm">Delete medication</button>'}`;
}
function grab(){
  edit.name=$('#f_name').value.trim();edit.dose=$('#f_dose').value.trim();
  edit.perDose=Math.max(1,parseInt($('#f_per').value)||1);edit.stock=Math.max(0,parseInt($('#f_stock').value)||0);
  edit.packSize=Math.max(1,parseInt($('#f_pack').value)||1);edit.price=Math.max(0,parseFloat($('#f_price').value)||0);
}
const closeSheet=()=>{$('#sheet').classList.remove('open');edit=null};

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  if(a==='tab'){tab=b.dataset.k;render();window.scrollTo(0,0)}
  else if(a==='tk')toggle(b.dataset.k);
  else if(a==='new')openEdit();
  else if(a==='edit')openEdit(b.dataset.id);
  else if(a==='close')closeSheet();
  else if(a==='addt'){grab();const t=$('#f_t').value;if(t&&!edit.times.includes(t)){edit.times.push(t);edit.times.sort()}drawSheet()}
  else if(a==='rmt'){grab();edit.times.splice(+b.dataset.i,1);drawSheet()}
  else if(a==='savem'){
    grab();
    if(!edit.name){alert('Enter a medication name.');return}
    if(!edit.times.length){alert('Add at least one time.');return}
    const isNew=edit.isNew;delete edit.isNew;
    if(isNew)S.meds.push(edit);else S.meds=S.meds.map(m=>m.id===edit.id?edit:m);
    save();closeSheet();render();
  }
  else if(a==='delm'){if(confirm('Delete '+edit.name+'?')){S.meds=S.meds.filter(m=>m.id!==edit.id);save();closeSheet();render()}}
  else if(a==='set'){
    const p1=Math.min(31,Math.max(1,parseInt($('#pd1').value)||15)),p2=Math.min(31,Math.max(1,parseInt($('#pd2').value)||30));
    S.paydays=[p1,p2];S.cur=$('#cur').value.trim()||'₱';save();render();
  }
  else if(a==='perm')enablePush();
});

/* ---------- reminders (while app is open) ---------- */
function tick(){
  const now=Date.now();
  dosesToday().forEach(d=>{
    const s=status(d);
    if(d.taken||s==='upcoming')return;
    if(!notified[d.key]||now-notified[d.key]>10*60*1000){
      notified[d.key]=now;
    }
  });
  const late=dosesToday().filter(d=>!d.taken&&status(d)==='overdue').length;
  document.title=late?'('+late+') BlovMed':'BlovMed';
  if(!edit&&document.activeElement.tagName!=='INPUT')render();
}
setInterval(tick,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!edit)render()});

/* ---------- push alerts ---------- */
const CFG=window.CFG||{};
const b64=x=>{x=x.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(x+'='.repeat((4-x.length%4)%4)),c=>c.charCodeAt(0))};
async function enablePush(){
  try{
    if(!CFG.worker||!CFG.vapid||/YOUR_/.test(CFG.worker+CFG.vapid)){alert('App is not configured yet (config.js).');return}
    if(!('serviceWorker'in navigator)||!('PushManager'in window)){alert('Add this app to your Home Screen and open it from the icon first.');return}
    const reg=await navigator.serviceWorker.register('sw.js');
    if(await Notification.requestPermission()!=='granted'){alert('Alerts were not allowed. Turn them on in Settings > Notifications.');return}
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(CFG.vapid)});
    S.sub=sub.toJSON();save();await sync(true);render();
  }catch(e){alert('Could not turn on alerts: '+e.message)}
}
let syncT;
function sync(now){
  if(!S.sub||!CFG.worker)return Promise.resolve();
  clearTimeout(syncT);
  return new Promise(res=>{syncT=setTimeout(async()=>{
    try{
      const y=new Date();y.setDate(y.getDate()-1);
      await fetch(CFG.worker+'/sync',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
        sub:S.sub,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,
        meds:S.meds.map(m=>({id:m.id,name:m.name,perDose:m.perDose,times:m.times.map(mins)})),
        taken:Object.keys(S.log).filter(k=>k>=ymd(y)).map(k=>{const p=k.split('|');return p[0]+'|'+p[1]+'|'+mins(p[2])})
      })});
    }catch(e){}
    res();
  },now?0:800)});
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync(true)});
render();tick();
</script>
</body>
</html>
